<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>白手起家：街角創業錄</title>
  <style>
    :root {
      --bg-app: #f4efe6;
      --bg-card: #ffffff;
      --bg-dark: #2c221e;
      --text-main: #2b211c;
      --text-muted: #78685f;
      --accent: #c86d2d;
      --accent-hover: #a8561d;
      --green: #1f8a5b;
      --green-bg: #e7f6ef;
      --red: #c93b3b;
      --red-bg: #fdeaea;
      --amber: #b87400;
      --amber-bg: #fff5e0;
      --border: #e4dbd0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #e5ddd0;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      overscroll-behavior: none;
      height: 100%;
    }

    #app {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0,0,0,0.08);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 頂部狀態欄 HUD */
    header {
      background: var(--bg-dark);
      color: #fff;
      padding: max(12px, env(safe-area-inset-top)) 14px 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .day-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 15px;
    }

    .weekend-tag {
      background: #e06d24;
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .hud-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .hud-item {
      background: rgba(255,255,255,0.08);
      padding: 6px 8px;
      border-radius: 8px;
    }

    .hud-label {
      font-size: 10px;
      color: #cbbcb3;
      display: block;
    }

    .hud-val {
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      display: block;
    }

    .hud-val.danger { color: #ff7b7b; }
    .hud-val.good { color: #6ee7b7; }

    /* 債務與狀態列 */
    .status-strip {
      background: #3a2d28;
      padding: 6px 14px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .status-strip::-webkit-scrollbar { display: none; }

    .pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 99px;
      white-space: nowrap;
      font-weight: 600;
      cursor: pointer;
    }
    .pill.BUFF { background: var(--green-bg); color: var(--green); }
    .pill.DEBUFF { background: var(--red-bg); color: var(--red); }
    .pill.MIXED { background: var(--amber-bg); color: var(--amber); }
    .pill.DEBT { background: #7f1d1d; color: #fecaca; }

    /* 主內容區 */
    main {
      flex: 1;
      padding: 12px 14px 90px;
    }

    /* 分頁導覽 */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #e6ddd1;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 8px 4px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .tab-btn.active {
      background: #fff;
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* 卡片樣式 */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .card-title {
      font-weight: 700;
      font-size: 15px;
    }

    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
    }
    .badge-perish { background: var(--amber-bg); color: var(--amber); }
    .badge-keep { background: var(--green-bg); color: var(--green); }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* 定價策略列 */
    .price-strategy {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .strat-btn {
      border: 1px solid var(--border);
      background: #faf7f2;
      padding: 8px 4px;
      border-radius: 10px;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
    }

    .strat-btn.active {
      border-color: var(--accent);
      background: #fff3eb;
      color: var(--accent);
      font-weight: 700;
    }

    /* 備貨控制器 */
    .qty-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #faf7f2;
      padding: 6px 10px;
      border-radius: 10px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-btn {
      min-width: 34px;
      height: 32px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .step-btn:active { background: #eee; }

    .qty-display {
      min-width: 36px;
      text-align: center;
      font-weight: 700;
      font-size: 15px;
    }

    /* 設備與購買按鈕 */
    .action-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .action-btn:disabled {
      background: #cbbcb3;
      cursor: not-allowed;
    }
    .action-btn.secondary {
      background: #4b3e37;
    }

    /* 底部固定開工列 */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 10px 14px max(10px, env(safe-area-inset-bottom));
      z-index: 15;
    }

    .dock-summary {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .warn-text { color: var(--red); font-weight: 700; }

    /* 彈窗 Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(25, 18, 14, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.show { display: flex; }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 430px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 8px;
    }

    /* 損益表表格 */
    .pnl-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 13px;
    }
    .pnl-row.total {
      border-top: 2px solid var(--text-main);
      border-bottom: none;
      font-weight: 800;
      font-size: 16px;
      margin-top: 6px;
      padding-top: 10px;
    }

    /* 營業模擬進度條 */
    .sim-bar-wrap {
      background: #eee5d8;
      height: 14px;
      border-radius: 99px;
      overflow: hidden;
      margin: 12px 0;
    }
    .sim-bar-fill {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.2s linear;
    }
    .sim-log {
      background: #faf7f2;
      border-radius: 10px;
      padding: 10px;
      height: 130px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    /* 難度卡片 */
    .diff-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .diff-card:hover { border-color: var(--accent); background: #fffaf5; }

    /* 進度條（通關路線） */
    .prog-bg {
      background: #ece4d8;
      height: 8px;
      border-radius: 99px;
      overflow: hidden;
      margin: 4px 0 8px;
    }
    .prog-fill {
      background: var(--green);
      height: 100%;
    }

    .toast {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 24, 20, 0.92);
      color: #fff;
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 12px;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .toast.show { opacity: 1; }

    input[type="text"], textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      user-select: text;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="top-bar">
      <div class="day-badge">
        <span id="ui-day">第 1 日・週一</span>
        <span id="ui-weekend" class="weekend-tag" style="display:none;">週末旺季</span>
        <span id="ui-stores" style="font-size:12px;color:#e2c6a8;">🏠 1間店</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="UI.openEndings()">🎯 版圖</button>
        <button class="icon-btn" onclick="UI.openSettings()">⚙️ 設定</button>
      </div>
    </div>
    <div class="hud-grid">
      <div class="hud-item">
        <span class="hud-label">可用現金</span>
        <span class="hud-val" id="ui-cash">$8,000</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">預計毛利率</span>

      <div class="hud-item">
        <span class="hud-label">盈虧平衡點</span>

        <span class="hud-label">店鋪口碑</span>
        <span class="hud-val" id="ui-rep">50 / 100</span>
      </div>
    </div>
  </header>

  <!-- 債務與Buff/Debuff狀態列 -->
  <div class="status-strip" id="ui-status-strip"></div>

  <main>
    <!-- 盤前資訊提示卡 -->
    <div class="card" style="background:#fffaf3; border-color:#ead9c3;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:13px;">📊 今日市場與產能預估</strong>
        <span id="ui-contract-badge" class="badge badge-perish" style="display:none;">已接大單</span>
      </div>
      <div style="font-size:12px; color:var(--text-muted); margin-top:6px; line-height:1.5;" id="ui-forecast-text">
        預計自然客流：約 35 人｜設備總產能：40 點
      </div>
      <div class="price-strategy">
        <div class="strat-btn" id="strat-0.85" onclick="Game.setPriceMult(0.85)">
          薄利促銷<br><small>售價85%｜客流+20%</small>
        </div>
        <div class="strat-btn active" id="strat-1" onclick="Game.setPriceMult(1)">
          標準定價<br><small>售價100%｜正常客流</small>
        </div>
        <div class="strat-btn" id="strat-1.15" onclick="Game.setPriceMult(1.15)">
          精品溢價<br><small>售價115%｜客流-18%</small>
        </div>
      </div>
    </div>

    <!-- 三大分頁 -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-btn-prep" onclick="UI.switchTab('prep')">📦 備貨與毛利</button>
      <button class="tab-btn" id="tab-btn-equip" onclick="UI.switchTab('equip')">🛠️ 設備與擴張</button>
      <button class="tab-btn" id="tab-btn-ledger" onclick="UI.switchTab('ledger')">🧾 經營紀錄</button>
    </div>

    <div id="tab-prep"></div>
    <div id="tab-equip" style="display:none;"></div>
    <div id="tab-ledger" style="display:none;"></div>
  </main>

  <!-- 底部開工結算欄 -->
  <div class="bottom-dock">
    <div class="dock-summary">
      <span>備貨開支：<strong id="ui-prep-cost">$0</strong></span>
      <span>產能負荷：<strong id="ui-cap-usage">0 / 40</strong></span>
    </div>
    <button class="action-btn" id="btn-start-day" onclick="Game.startOperatingDay()">
      🚀 扣減備貨費並開始今日營業
    </button>
  </div>
</div>

<!-- 通用彈窗容器 -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal-box" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

  URL_KEY: "startup_game_gas_url",
  current: JSON.parse(JSON.stringify(FALLBACK_CONFIG)),

  getGasUrl() {
    return localStorage.getItem(this.URL_KEY) || DEFAULT_GAS_URL;
  },

  setGasUrl(url) {
    localStorage.setItem(this.URL_KEY, url.trim());
  },

  init(onUpdated) {
    // 1. 立即讀取本地快取（0ms 啟動）
    const cached = localStorage.getItem(this.CACHE_KEY);
    if (cached) {
      try {
        this.current = JSON.parse(cached);
      } catch (e) { console.warn("快取解析失敗，改用保底數值"); }
    }

    // 2. 背景非同步向 Google Sheet GAS 拉取最新數值
    const gasUrl = this.getGasUrl();
    if (!gasUrl) return;

    fetch(gasUrl)
      .then(res => res.json())
      .then(data => {
        if (data && data.meta && Array.isArray(data.products)) {
          const oldVer = this.current.meta?.config_version;
          this.current = data;
          localStorage.setItem(this.CACHE_KEY, JSON.stringify(data));
          if (oldVer !== data.meta.config_version) {
            UI.showToast(`已同步最新遊戲數值表 v${data.meta.config_version}`);
          }
          if (onUpdated) onUpdated();
        }
      })
      .catch(err => console.warn("背景同步 GAS 失敗（將繼續使用本地快取）：", err));
  }
};

/**
 * ============================================================
 * 3. SaveManager：解耦存檔管理（方便日後轉 Capacitor 原生儲存）
 * ============================================================
 */
const SaveManager = {
  SAVE_KEY: "startup_game_save_v1",

  load() {
    const raw = localStorage.getItem(this.SAVE_KEY);
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  },

  save(state) {
    state.updatedAt = Date.now();
    localStorage.setItem(this.SAVE_KEY, JSON.stringify(state));
  },

  clear() {
    localStorage.removeItem(this.SAVE_KEY);
  },

  exportCode(state) {
    return btoa(encodeURIComponent(JSON.stringify(state)));
  },

  importCode(code) {
    try {
      const obj = JSON.parse(decodeURIComponent(atob(code.trim())));
      if (!obj || typeof obj.cash !== "number" || !obj.day) throw new Error("格式錯誤");
      this.save(obj);
      return obj;
    } catch (e) {
      return null;
    }
  }
};

/**
 * ============================================================
 * 4. Game：核心商業模擬引擎
 * ============================================================
 */
const Game = {
  state: null,
  prepOrder: {},      // 今日新買入嘅備貨數量 { prod_01: 15, ... }
  priceMult: 1,       // 今日定價倍率 (0.85 / 1 / 1.15)
  tempCostMult: 1,    // 單日臨時原料折扣（由抉擇卡觸發）
  activeContract: null, // 今日接下嘅急單 { capNeeded, reward, penalty }
  cardShownToday: false,

  WEEKDAYS: ["週一", "週二", "週三", "週四", "週五", "週六", "週日"],

  boot() {
    ConfigLoader.init(() => {
      if (this.state) UI.renderAll();
    });

    const saved = SaveManager.load();
    if (saved && !saved.isGameOver) {
      this.state = saved;
      this.resetDailyTempState();
      UI.renderAll();
      this.checkMorningEvents();
    } else {
      UI.openDifficultyModal();
    }
  },

  startNewGame(diffId) {
    const cfg = ConfigLoader.current;
    const diff = cfg.difficulties.find(d => d.diff_id === diffId) || cfg.difficulties[1];

    this.state = {
      diffId: diff.diff_id,
      day: 1,
      cash: Number(diff.start_cash),
      reputation: 50,
      stores: 1,
      totalRevenue: 0,
      loansUsed: 0,
      remainingDebt: 0,
      dailyLoanRepayment: 0,
      zeroShortageStreak: 0,
      equipmentOwned: { eq_01: 1 }, // 開局自帶基礎半自動咖啡機
      inventory: {},               // 耐放品結轉庫存
      activeStatuses: [],          // [{ status_id, daysLeft }]
      marginHistory: [],           // 記錄每日毛利率（供通關判定）
      historyLogs: [],             // 最近 15 日損益摘要
      isGameOver: false
    };

    this.resetDailyTempState();
    SaveManager.save(this.state);
    UI.closeModal();
    UI.renderAll();
    UI.showToast(`已開啟「${diff.name}」創業挑戰！`);
  },

  resetDailyTempState() {
    this.prepOrder = {};
    this.priceMult = 1;
    this.tempCostMult = 1;
    this.activeContract = null;
    this.cardShownToday = false;
    (ConfigLoader.current.products || []).forEach(p => {
      this.prepOrder[p.prod_id] = 0;
    });
  },

  getDifficulty() {
    const cfg = ConfigLoader.current;
    return cfg.difficulties.find(d => d.diff_id === this.state.diffId) || cfg.difficulties[1];
  },

  isWeekend() {
    const weekdayIdx = (this.state.day - 1) % 7;
    return weekdayIdx >= 4; // 週五(4)、週六(5)、週日(6)
  },

  getWeekdayName() {
    return this.WEEKDAYS[(this.state.day - 1) % 7];
  },

  // 計算當前有效狀態倍率
  getStatusMultiplier(targetStat) {
    const cfg = ConfigLoader.current;
    let mult = 1;
    this.state.activeStatuses.forEach(active => {
      const def = cfg.statuses.find(s => s.status_id === active.status_id);
      if (def && def.target_stat === targetStat) {
        mult *= Number(def.modifier_val);
      }
    });
    return mult;
  },

  // 計算總設備產能與每日固定開支
  getFacilityStats() {
    const cfg = ConfigLoader.current;
    let totalCapacity = 0;
    let equipOpex = 0;

    cfg.equipment.forEach(eq => {
      const count = this.state.equipmentOwned[eq.equip_id] || 0;
      totalCapacity += Number(eq.daily_capacity) * count;
      equipOpex += Number(eq.daily_opex) * count;
    });

    // 網紅熱潮雙刃劍：雙倍設備損耗
    const hasKolHype = this.state.activeStatuses.some(s => s.status_id === "st_kol_hype");
    if (hasKolHype) equipOpex *= 2;

    const rent = Number(cfg.meta.base_daily_rent) * this.state.stores;
    const fixedOpex = rent + equipOpex + this.state.dailyLoanRepayment;

    return { totalCapacity, equipOpex, rent, fixedOpex };
  },

  // 計算單品今日實際進貨單價
  getAdjustedUnitCost(product) {
    const statusMult = this.getStatusMultiplier("UNIT_COST");
    return Math.max(1, Math.round(Number(product.unit_cost) * statusMult * this.tempCostMult));
  },

  // 計算今日預計客流量
  getEstimatedDemand() {
    const cfg = ConfigLoader.current;
    let demand = Number(cfg.meta.base_daily_demand);
    // 每多一間分店增加 80% 基礎客流
    demand *= (1 + (this.state.stores - 1) * 0.8);
    // 口碑影響（50分為基準，每10分影響 12%）
    demand *= (1 + (this.state.reputation - 50) * 0.012);
    // 週末效應
    if (this.isWeekend()) demand *= Number(cfg.meta.weekend_demand_mult);
    // 狀態 Buff/Debuff
    demand *= this.getStatusMultiplier("DEMAND");
    // 定價策略影響
    if (this.priceMult < 1) demand *= 1.20;
    if (this.priceMult > 1) demand *= 0.82;

    return Math.max(5, Math.round(demand));
  },

  // 盤前操作：調整備貨量
  adjustPrep(prodId, delta) {
    const current = this.prepOrder[prodId] || 0;
    const next = Math.max(0, current + delta);
    this.prepOrder[prodId] = next;
    UI.renderPrepTab();
    UI.updateDockAndHud();
  },

  setPriceMult(mult) {
    this.priceMult = mult;
    document.querySelectorAll(".strat-btn").forEach(el => el.classList.remove("active"));
    const btn = document.getElementById(`strat-${mult}`);
    if (btn) btn.classList.add("active");
    UI.renderPrepTab();
    UI.updateDockAndHud();
  },

  // 購買設備
  buyEquipment(equipId) {
    const eq = ConfigLoader.current.equipment.find(e => e.equip_id === equipId);
    if (!eq) return;
    const cost = Number(eq.buy_cost);
    if (this.state.cash < cost) {
      UI.showToast("現金不足，無法購置設備！");
      return;
    }
    this.state.cash -= cost;
    this.state.equipmentOwned[equipId] = (this.state.equipmentOwned[equipId] || 0) + 1;
    SaveManager.save(this.state);
    UI.renderAll();
    UI.showToast(`已購入「${eq.name}」！每日產能 +${eq.daily_capacity}`);
  },

  // 開設新分店
  openNewStore() {
    const cost = this.getNextStoreCost();
    if (this.state.cash < cost) {
      UI.showToast("現金不足以支付新分店頂手費與裝修！");
      return;
    }
    this.state.cash -= cost;
    this.state.stores += 1;
    SaveManager.save(this.state);
    UI.renderAll();
    UI.showToast(`🎉 第 ${this.state.stores} 間分店正式開業！`);
  },

  getNextStoreCost() {
    if (this.state.stores === 1) return 22000;
    if (this.state.stores === 2) return 45000;
    return 80000;
  },

  // 盤前商業抉擇卡觸發檢查
  checkMorningEvents() {
    if (this.cardShownToday) return;
    // 第 4 日起，每逢偶數日或 55% 機率彈出二選一抉擇卡
    if (this.state.day >= 4 && (this.state.day % 2 === 0 || Math.random() < 0.55)) {
      const eligible = ConfigLoader.current.decisionCards.filter(c => Number(c.min_day) <= this.state.day);
      if (eligible.length > 0) {
        const card = eligible[Math.floor(Math.random() * eligible.length)];
        this.cardShownToday = true;
        UI.openDecisionCardModal(card);
      }
    }
  },

  applyCardEffect(effectStr) {
    if (!effectStr || effectStr === "NONE") {
      UI.closeModal();
      return;
    }
    const parts = effectStr.split(";");
    parts.forEach(part => {
      const [type, val1, val2, val3] = part.split(":");
      if (type === "CASH") {
        this.state.cash += Number(val1);
      } else if (type === "STATUS") {
        this.addStatus(val1);
      } else if (type === "TEMP_COST") {
        this.tempCostMult = Number(val1);
      } else if (type === "CONTRACT") {
        this.activeContract = {
          capNeeded: Number(val1),
          reward: Number(val2),
          penalty: Number(val3)
        };
      }
    });
    SaveManager.save(this.state);
    UI.closeModal();
    UI.renderAll();
    UI.showToast("已執行商業決策！");
  },

  addStatus(statusId) {
    const def = ConfigLoader.current.statuses.find(s => s.status_id === statusId);
    if (!def) return;
    const existing = this.state.activeStatuses.find(s => s.status_id === statusId);
    if (existing) {
      existing.daysLeft = Math.max(existing.daysLeft, Number(def.duration_days));
    } else {
      this.state.activeStatuses.push({ status_id: statusId, daysLeft: Number(def.duration_days) });
    }
  },

  // 開始今日營業模擬
  startOperatingDay() {
    const cfg = ConfigLoader.current;
    // 1. 計算並扣除今日備貨現金支出
    let prepCashSpent = 0;
    const availableStock = {};
    cfg.products.forEach(p => {
      const qty = this.prepOrder[p.prod_id] || 0;
      const unitCost = this.getAdjustedUnitCost(p);
      prepCashSpent += qty * unitCost;
      availableStock[p.prod_id] = (this.state.inventory[p.prod_id] || 0) + qty;
    });

    if (prepCashSpent > this.state.cash) {
      UI.showToast("可用現金唔夠支付今日備貨費，請減少入貨量！");
      return;
    }

    this.state.cash -= prepCashSpent;
    UI.updateDockAndHud();

    // 2. 運行營業結算演算
    const simResult = this.simulateDaySales(availableStock, prepCashSpent);

    // 3. 播放 3.5 秒動態營業畫面後顯示日結損益表
    UI.runOperatingAnimation(simResult, () => {
      this.finalizeDailyPnL(simResult);
    });
  },

  simulateDaySales(availableStock, prepCashSpent) {
    const cfg = ConfigLoader.current;
    const facility = this.getFacilityStats();
    const estDemand = this.getEstimatedDemand();
    // 實際客流有 ±12% 自然波動
    const actualCustomers = Math.max(4, Math.round(estDemand * (0.88 + Math.random() * 0.24)));

    // 檢查設備突發小故障
    let breakdownCost = 0;
    let effectiveCapacity = facility.totalCapacity;
    cfg.equipment.forEach(eq => {
      const count = this.state.equipmentOwned[eq.equip_id] || 0;
      if (count > 0 && Math.random() < Number(eq.breakdown_chance)) {
        breakdownCost += Math.round(Number(eq.daily_opex) * 1.5);
        effectiveCapacity = Math.round(effectiveCapacity * 0.85);
      }
    });

    // 若接了急單，先預留急單產能
    let contractSuccess = false;
    let contractDelta = 0;
    if (this.activeContract) {
      if (effectiveCapacity >= this.activeContract.capNeeded) {
        effectiveCapacity -= this.activeContract.capNeeded;
        contractSuccess = true;
        contractDelta = this.activeContract.reward;
      } else {
        contractSuccess = false;
        contractDelta = -this.activeContract.penalty;
      }
    }

    let remainingCap = effectiveCapacity;
    let revenue = 0;
    let soldCogs = 0;
    let customersServed = 0;
    let stockouts = 0;
    let capacityShortages = 0;

    const unlockedProds = cfg.products.filter(p => Number(p.unlock_day) <= this.state.day);
    const soldQtyMap = {};
    unlockedProds.forEach(p => soldQtyMap[p.prod_id] = 0);

    // 模擬每位客人點單
    for (let i = 0; i < actualCustomers; i++) {
      // 隨機挑選一款有庫存嘅產品，或隨機點單
      const inStockProds = unlockedProds.filter(p => availableStock[p.prod_id] > 0);
      if (inStockProds.length === 0) {
        stockouts++;
        continue;
      }
      const chosen = inStockProds[Math.floor(Math.random() * inStockProds.length)];
      const load = Number(chosen.prep_load);
      if (remainingCap < load) {
        capacityShortages++;
        continue;
      }

      // 成交！
      remainingCap -= load;
      availableStock[chosen.prod_id] -= 1;
      soldQtyMap[chosen.prod_id] += 1;
      customersServed++;

      const actualSellPrice = Math.round(Number(chosen.sell_price) * this.priceMult);
      const unitCost = this.getAdjustedUnitCost(chosen);
      revenue += actualSellPrice;
      soldCogs += unitCost;
    }

    // 處理收市剩餘庫存（耐放品結轉明日；易腐壞品過期報廢，按 1 - spoilage_rate 折價回收殘值）
    let spoilageLoss = 0;
    let salvageRefund = 0;
    const nextInventory = {};
    const spoilRate = Number(cfg.meta.spoilage_rate);

    unlockedProds.forEach(p => {
      const leftover = availableStock[p.prod_id] || 0;
      const isPerish = (p.is_perishable === true || String(p.is_perishable).toUpperCase() === "TRUE");
      const unitCost = this.getAdjustedUnitCost(p);

      if (leftover > 0) {
        if (isPerish) {
          const loss = Math.round(leftover * unitCost * spoilRate);
          const refund = (leftover * unitCost) - loss;
          spoilageLoss += loss;
          salvageRefund += refund;
          nextInventory[p.prod_id] = 0;
        } else {
          nextInventory[p.prod_id] = leftover;
        }
      } else {
        nextInventory[p.prod_id] = 0;
      }
    });

    const totalRevenueWithContract = revenue + (contractSuccess ? contractDelta : 0);
    const totalCogsAndSpoilage = soldCogs + spoilageLoss;
    const grossProfit = totalRevenueWithContract - totalCogsAndSpoilage;
    const grossMargin = totalRevenueWithContract > 0 ? (grossProfit / totalRevenueWithContract) : 0;

    const penaltyExpense = (!contractSuccess && this.activeContract) ? this.activeContract.penalty : 0;
    const totalFixedAndExtra = facility.fixedOpex + breakdownCost + penaltyExpense;
    const netCashFlow = grossProfit - totalFixedAndExtra;

    return {
      actualCustomers,
      customersServed,
      stockouts,
      capacityShortages,
      revenue: totalRevenueWithContract,
      soldCogs,
      spoilageLoss,
      salvageRefund,
      grossProfit,
      grossMargin,
      rent: facility.rent,
      equipOpex: facility.equipOpex,
      loanRepayment: this.state.dailyLoanRepayment,
      breakdownCost,
      penaltyExpense,
      contractSuccess,
      activeContract: this.activeContract,
      netCashFlow,
      nextInventory,
      prepCashSpent
    };
  },

  finalizeDailyPnL(res) {
    // 1. 結算現金（回收易腐壞品殘值 + 營業額 - 固定開支 - 維修與違約金；備貨費開工時已扣）
    const cashDeltaAfterPrep = res.revenue + res.salvageRefund - res.rent - res.equipOpex - res.loanRepayment - res.breakdownCost - res.penaltyExpense;
    this.state.cash = Math.round(this.state.cash + cashDeltaAfterPrep);
    this.state.totalRevenue += res.revenue;
    this.state.inventory = res.nextInventory;

    // 2. 扣減貸款餘額
    if (this.state.remainingDebt > 0) {
      this.state.remainingDebt = Math.max(0, this.state.remainingDebt - res.loanRepayment);
      if (this.state.remainingDebt === 0) {
        this.state.dailyLoanRepayment = 0;
      }
    }

    // 3. 更新店鋪口碑與動態 Buff/Debuff
    let repDelta = 0;
    const newBadges = [];

    if (res.capacityShortages > Math.max(2, res.actualCustomers * 0.2)) {
      repDelta -= 4;
      this.addStatus("st_bad_review");
      newBadges.push("🔴 排隊過長觸發「排隊負評發酵」");
    } else if (res.stockouts > Math.max(3, res.actualCustomers * 0.25)) {
      repDelta -= 3;
      newBadges.push("⚠️ 嚴重斷貨導致口碑下降");
    } else if (res.customersServed > 0) {
      repDelta += 2;
    }

    if (res.stockouts === 0 && res.customersServed >= 10) {
      this.state.zeroShortageStreak += 1;
      if (this.state.zeroShortageStreak >= 3) {
        this.addStatus("st_zero_shortage");
        newBadges.push("🟢 連續3日無斷貨，獲得「零缺貨口碑」");
      }
    } else {
      this.state.zeroShortageStreak = 0;
    }

    if (this.state.cash >= 30000) {
      this.addStatus("st_vip_supplier");
      newBadges.push("🟢 資金充裕獲得「供應商 VIP 折扣」");
    }

    // 隨機明日天氣輪換（35% 機率出現晴朗或暴雨）
    const weatherRoll = Math.random();
    if (weatherRoll < 0.20) {
      this.addStatus("st_sunny");
      newBadges.push("🟢 預報明日「晴朗好天氣」");
    } else if (weatherRoll > 0.85 && this.state.day >= 3) {
      this.addStatus("st_rainstorm");
      newBadges.push("🔴 預報明日「暴雨預警」");
    }

    this.state.reputation = Math.max(0, Math.min(100, this.state.reputation + repDelta));

    // 4. 記錄歷史毛利與流水帳
    this.state.marginHistory.push(res.grossMargin);
    if (this.state.marginHistory.length > 7) this.state.marginHistory.shift();

    this.state.historyLogs.unshift({
      day: this.state.day,
      revenue: res.revenue,
      margin: Math.round(res.grossMargin * 100),
      net: res.netCashFlow,
      cashAfter: this.state.cash
    });
    if (this.state.historyLogs.length > 15) this.state.historyLogs.pop();

    // 5. 遞減現有狀態剩餘天數
    this.state.activeStatuses = this.state.activeStatuses
      .map(s => ({ ...s, daysLeft: s.daysLeft - 1 }))
      .filter(s => s.daysLeft > 0);

    SaveManager.save(this.state);
    UI.renderAll();
    UI.openPnLModal(res, repDelta, newBadges);
  },

  // 關閉日結損益表後，檢查：1. 資金鏈斷裂(借貸/破產) 2. 三大通關結局 3. 進入下一日
  proceedAfterPnL() {
    // 檢查資金鏈斷裂（Cash < 0）
    if (this.state.cash < 0) {
      const diff = this.getDifficulty();
      if (this.state.loansUsed < Number(diff.max_loans)) {
        // 觸發第一次緊急救命貸款
        const deficit = Math.abs(this.state.cash);
        const principal = deficit + Number(diff.loan_buffer);
        const totalRepay = Math.ceil(principal * (1 + Number(diff.interest_rate)));
        const dailyPay = Math.ceil(totalRepay / Number(diff.repay_days));

        this.state.loansUsed += 1;
        this.state.cash = Number(diff.loan_buffer);
        this.state.remainingDebt += totalRepay;
        this.state.dailyLoanRepayment += dailyPay;
        this.addStatus("st_credit_tight");
        SaveManager.save(this.state);
        UI.renderAll();
        UI.openBailoutModal(deficit, principal, totalRepay, dailyPay, Number(diff.max_loans) - this.state.loansUsed);
        return;
      } else {
        // 第二次跌穿 $0 或硬核模式 -> 正式破產 Game Over
        this.state.isGameOver = true;
        SaveManager.save(this.state);
        UI.openGameOverModal();
        return;
      }
    }

    // 檢查是否達成三大通關結局之一（必須無未還貸款）
    if (this.state.remainingDebt <= 0) {
      const achieved = this.checkEndings();
      if (achieved) {
        UI.openVictoryModal(achieved);
        return;
      }
    }

    this.advanceToNextDay();
  },

  advanceToNextDay() {
    this.state.day += 1;
    this.resetDailyTempState();
    SaveManager.save(this.state);
    UI.closeModal();
    UI.renderAll();
    this.checkMorningEvents();
  },

  getAvg7DayMargin() {
    if (this.state.marginHistory.length === 0) return 0;
    const sum = this.state.marginHistory.reduce((a, b) => a + b, 0);
    return sum / this.state.marginHistory.length;
  },

  checkEndings() {
    const avgMargin = this.getAvg7DayMargin();
    for (const end of ConfigLoader.current.endings) {
      const storeOk = end.ending_id === "end_artisan"
        ? this.state.stores === 1
        : this.state.stores >= Number(end.req_stores);
      const cashOk = this.state.cash >= Number(end.req_cash);
      const repOk = this.state.reputation >= Number(end.req_rep);
      const marginOk = this.state.marginHistory.length >= 3 && avgMargin >= Number(end.req_margin);
      const dayOk = this.state.day <= Number(end.max_day);
      const revOk = this.state.totalRevenue >= Number(end.req_total_rev);

      if (storeOk && cashOk && repOk && marginOk && dayOk && revOk) {
        return end;
      }
    }
    return null;
  }
};

const UI = {
  currentTab: "prep",

  showToast(msg) {
    const el = document.getElementById("toast");

    el.classList.add("show");

  },

  switchTab(tab) {
    this.currentTab = tab;
    ["prep", "equip", "ledger"].forEach(t => {
      document.getElementById(`tab-${t}`).style.display = t === tab ? "block" : "none";
      document.getElementById(`tab-btn-${t}`).classList.toggle("active", t === tab);
    });
    if (tab === "prep") this.renderPrepTab();
    if (tab === "equip") this.renderEquipTab();
    if (tab === "ledger") this.renderLedgerTab();
  },

  renderAll() {
    if (!Game.state) return;
    this.updateDockAndHud();
    this.renderStatusStrip();
    this.renderPrepTab();
    this.renderEquipTab();
    this.renderLedgerTab();
  },

  updateDockAndHud() {
    const s = Game.state;
    const cfg = ConfigLoader.current;
    const fac = Game.getFacilityStats();
    const estDemand = Game.getEstimatedDemand();

    document.getElementById("ui-day").textContent = `第 ${s.day} 日・${Game.getWeekdayName()}`;
    document.getElementById("ui-weekend").style.display = Game.isWeekend() ? "inline-block" : "none";
    document.getElementById("ui-stores").textContent = `🏠 ${s.stores}間店`;

    const cashEl = document.getElementById("ui-cash");
    cashEl.textContent = `$${s.cash.toLocaleString()}`;
    cashEl.className = "hud-val" + (s.cash < 1000 ? " danger" : "");

    // 計算預計備貨成本、預計毛利率與產能負荷
    let prepCost = 0;
    let capLoad = Game.activeContract ? Game.activeContract.capNeeded : 0;
    let estSalesRev = 0;
    let estSalesCost = 0;

    cfg.products.forEach(p => {
      if (Number(p.unlock_day) > s.day) return;
      const buyQty = Game.prepOrder[p.prod_id] || 0;
      const totalQty = (s.inventory[p.prod_id] || 0) + buyQty;
      const unitCost = Game.getAdjustedUnitCost(p);
      const sellPrice = Math.round(Number(p.sell_price) * Game.priceMult);

      prepCost += buyQty * unitCost;
      capLoad += totalQty * Number(p.prep_load);
      estSalesRev += totalQty * sellPrice;
      estSalesCost += totalQty * unitCost;
    });

    const estMargin = estSalesRev > 0 ? Math.round(((estSalesRev - estSalesCost) / estSalesRev) * 100) : 0;
    const marginEl = document.getElementById("ui-margin");
    marginEl.textContent = `${estMargin}%`;
    marginEl.className = "hud-val" + (estMargin >= 60 ? " good" : estMargin < 40 ? " danger" : "");

    // 盈虧平衡點 = 固定開支 / 預計毛利率
    const breakEven = estMargin > 0 ? Math.round(fac.fixedOpex / (estMargin / 100)) : fac.fixedOpex;
    document.getElementById("ui-breakeven").textContent = `$${breakEven.toLocaleString()}`;
    document.getElementById("ui-rep").textContent = `${s.reputation} / 100`;

    // 市場預估提示
    const contractBadge = document.getElementById("ui-contract-badge");
    if (Game.activeContract) {
      contractBadge.style.display = "inline-block";
      contractBadge.textContent = `急單預留 ${Game.activeContract.capNeeded} 產能`;
    } else {
      contractBadge.style.display = "none";
    }

    document.getElementById("ui-forecast-text").innerHTML =
      `預計客流：<strong>約 ${estDemand} 人</strong>｜總產能上限：<strong>${fac.totalCapacity} 點</strong>｜固定日開支：<strong>$${fac.fixedOpex}</strong>`;

    document.getElementById("ui-prep-cost").textContent = `$${prepCost.toLocaleString()}`;
    const capEl = document.getElementById("ui-cap-usage");
    capEl.textContent = `${capLoad} / ${fac.totalCapacity}`;
    capEl.className = capLoad > fac.totalCapacity ? "warn-text" : "";

    const btn = document.getElementById("btn-start-day");
    btn.disabled = prepCost > s.cash;
    btn.textContent = prepCost > s.cash
      ? "⚠️ 現金不足以支付備貨費"
      : `🚀 支付 $${prepCost.toLocaleString()} 備貨並開始今日營業`;
  },

  renderStatusStrip() {
    const strip = document.getElementById("ui-status-strip");
    const cfg = ConfigLoader.current;
    const items = [];

    if (Game.state.remainingDebt > 0) {
      items.push(`<span class="pill DEBT" onclick="UI.showToast('尚餘緊急貸款 $${Game.state.remainingDebt}，每日自動還款 $${Game.state.dailyLoanRepayment}')">🚨 欠債 $${Game.state.remainingDebt} (-$${Game.state.dailyLoanRepayment}/日)</span>`);
    }

    Game.state.activeStatuses.forEach(st => {

      const icon = def.type === "BUFF" ? "🟢" : def.type === "DEBUFF" ? "🔴" : "🟡";
      items.push(`<span class="pill ${def.type}" onclick="UI.showToast('${def.name}：${def.desc}')">${icon} ${def.name} (${st.daysLeft}日)</span>`);

      items.push(`<span style="font-size:11px;color:#b8a89e;">今日市場平穩，暫無特殊狀態</span>`);
    }
    strip.innerHTML = items.join("");

      `☕ 吧台運作：成功接待 ${res.customersServed} 位客人，累計營業額 $${res.revenue.toLocaleString()}。`,

    const avgMargin = Math.round(Game.getAvg7DayMargin() * 100);
    this.openModal(`
      <span class="badge badge-keep">🏆 達成商業通關路線</span>
      <h2 class="modal-title" style="margin-top:8px;">${ending.title}</h2>
      <p style="font-size:13px;line-height:1.6;">${ending.desc}</p>
      <div class="pnl-row"><span>通關所用日數</span><strong>第 ${s.day} 日</strong></div>
      <div class="pnl-row"><span>最終可用現金</span><strong>$${s.cash.toLocaleString()}</strong></div>
      <div class="pnl-row"><span>近期平均毛利率</span><strong>${avgMargin}%</strong></div>
      <div class="pnl-row"><span>最終店鋪口碑</span><strong>${s.reputation} / 100</strong></div>
      <button class="action-btn" style="margin-top:12px;" onclick="Game.advanceToNextDay()">繼續留低經營（衝刺其他結局）</button>
      <button class="action-btn secondary" style="margin-top:8px;" onclick="UI.openDifficultyModal()">開啟新難度挑戰</button>
    `);
  },

  openEndings() {
    const s = Game.state;
    const avgMargin = Math.round(Game.getAvg7DayMargin() * 100);
    const listHtml = ConfigLoader.current.endings.map(end => {
      const cashPct = Math.min(100, Math.round((s.cash / Number(end.req_cash)) * 100));
      return `
        <div class="card">
          <div class="card-title">${end.title}</div>
          <div style="font-size:12px;color:var(--text-muted);margin:4px 0 8px;">${end.desc}</div>
          <div style="font-size:11px;line-height:1.6;">
            • 分店要求：${end.ending_id === "end_artisan" ? "保持單店 (1間)" : `至少 ${end.req_stores} 間`}（目前 ${s.stores} 間）<br>
            • 現金目標：$${Number(end.req_cash).toLocaleString()}（目前 ${cashPct}%）<br>
            • 口碑要求：${end.req_rep} 分（目前 ${s.reputation} 分）｜毛利率：${Math.round(end.req_margin * 100)}%（目前 ${avgMargin}%）<br>
            ${Number(end.max_day) < 999 ? `• 時間限制：<strong>第 ${end.max_day} 日前達成</strong>（目前第 ${s.day} 日）<br>` : ""}
            ${Number(end.req_total_rev) > 0 ? `• 累計營業額：$${Number(end.req_total_rev).toLocaleString()}（目前 $${s.totalRevenue.toLocaleString()}）` : ""}
          </div>
          <div class="prog-bg"><div class="prog-fill" style="width:${cashPct}%"></div></div>
        </div>
      `;
    }).join("");

    this.openModal(`
      <h2 class="modal-title">🎯 三大商業版圖（通關條件）</h2>
      <p style="font-size:12px;color:var(--text-muted);margin-top:0;">滿足任何一條路線且無未還貸款，即可於收市時觸發通關：</p>
      ${listHtml}
      <button class="action-btn secondary" onclick="UI.closeModal()">返回店鋪</button>
    `);
  },

  openSettings() {
    const currentUrl = ConfigLoader.getGasUrl();
    const exportStr = SaveManager.exportCode(Game.state);

    this.openModal(`
      <h2 class="modal-title">⚙️ 遊戲設定與資料管理</h2>
      <div style="font-size:12px;margin-bottom:12px;">
        <strong>Google Sheet API 網址（目前數值版本 v${ConfigLoader.current.meta.config_version}）：</strong>
        <input type="text" id="input-gas-url" value="${currentUrl}" placeholder="貼上 https://script.google.com/macros/s/.../exec" style="margin-top:4px;" />
        <button class="action-btn secondary" style="margin-top:6px;padding:7px;" onclick="UI.saveGasUrl()">儲存並立即從試算表同步數值</button>
      </div>
      <div style="font-size:12px;margin-bottom:12px;">
        <strong>匯出單機存檔碼（換機備份用）：</strong>
        <textarea rows="2" readonly style="margin-top:4px;">${exportStr}</textarea>
      </div>
      <div style="font-size:12px;margin-bottom:14px;">
        <strong>匯入存檔碼還原進度：</strong>
        <input type="text" id="input-import-code" placeholder="貼上存檔碼..." style="margin-top:4px;" />
        <button class="action-btn secondary" style="margin-top:6px;padding:7px;" onclick="UI.handleImport()">還原存檔</button>
      </div>
      <button class="action-btn" id="btn-confirm-reset" style="background:var(--red);" onclick="UI.handleResetClick(this)">
        🗑️ 清除進度並重新開始
      </button>
      <button class="action-btn secondary" style="margin-top:8px;" onclick="UI.closeModal()">關閉</button>
    `);
  },

  saveGasUrl() {
    const val = document.getElementById("input-gas-url").value;
    ConfigLoader.setGasUrl(val);
    localStorage.removeItem(ConfigLoader.CACHE_KEY);
    ConfigLoader.init(() => {
      UI.renderAll();
      UI.showToast("已成功連接並同步 Google Sheet 數據！");
    });
  },

  handleImport() {
    const code = document.getElementById("input-import-code").value;
    const loaded = SaveManager.importCode(code);
    if (loaded) {
      Game.state = loaded;
      Game.resetDailyTempState();
      UI.closeModal();
      UI.renderAll();
      UI.showToast("存檔還原成功！");
    } else {
      UI.showToast("存檔碼無效，請檢查有冇漏字！");
    }
  },

  handleResetClick(btn) {
    if (!btn.dataset.armed) {
      btn.dataset.armed = "1";
      btn.textContent = "⚠️ 確定清空所有進度開新局？再撳一次確認";
      return;
    }
    SaveManager.clear();
    UI.closeModal();
    UI.openDifficultyModal();
  }
};

window.addEventListener("DOMContentLoaded", () => Game.boot());
</script>
</body>
</html>
